apiVersion: v1
kind: Service
metadata:
  name: telco-cp-api
  namespace: telco
spec:
  selector:
    kubevirt.io/domain: telco-cp
  ports:
  - port: 6443
    targetPort: 6443
---
apiVersion: v1
kind: Service
metadata:
  name: telco-core-webui
  namespace: telco
spec:
  selector:
    kubevirt.io/domain: telco-core
  ports:
  - port: 9999
    targetPort: 30999
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: telco-cp
  namespace: telco
  labels:
    fiber.example/tenant: telco
    fiber.example/role: k3s-server
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: telco-cp-root
    spec:
      storage:
        resources:
          requests:
            storage: 20Gi
      source:
        registry:
          url: docker://quay.io/containerdisks/ubuntu:22.04
  template:
    metadata:
      labels:
        kubevirt.io/domain: telco-cp
        fiber.example/tenant: telco
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
          - name: dataplane
            bridge: {}
            macAddress: 02:00:00:20:00:01
        resources:
          requests:
            memory: 4Gi
      networks:
      - name: default
        pod: {}
      - name: dataplane
        multus:
          networkName: telco-dp
      volumes:
      - name: rootdisk
        dataVolume:
          name: telco-cp-root
      - name: cloudinitdisk
        cloudInitNoCloud:
          secretRef:
            name: telco-cp-cloudinit
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: telco-core
  namespace: telco
  labels:
    fiber.example/tenant: telco
