# The telco's own Kubernetes cluster: THREE KubeVirt VMs running k3s, one per role.
# The fiber company rents compute + network; everything inside the VMs
# (k3s, Flux, Open5GS) belongs to the telco.
#
#   telco-cp     k3s server, tainted CriticalAddonsOnly: control plane only
#   telco-core   agent, label telco.example/site=core: control-plane NFs, MongoDB, WebUI
#   telco-edge   agent, label telco.example/site=edge: UPF (user plane), UERANSIM gNB + UEs
#
# Every VM has eth0 (fiber company pod network: internet, k3s join through telco-cp-api)
# and net1 (the rented VLAN 300 slice). net1 gets a fixed address (cp 10.20.0.101, core .102,
# edge .103) set by the bootstrap, found by a fixed MAC, and k3s runs with --node-ip on it, so the
# telco cluster's inter-node traffic (flannel VXLAN: N2 gNB->AMF, N3/N4 UPF) rides the rented
# slice. eth0 is useless between nodes (every masquerade VM is 10.0.2.2), so there is NO fallback:
# if net1 is not found the bootstrap stops (see /var/log/telco-bootstrap.log).
#
# After k3s is up, the cp VM installs Flux pointing at the telco's Git repo
# (tenant-gitops/), so the telco deploys with 'git push'.
#
# The Ubuntu image is imported with CDI DataVolumes, not containerDisk
# (KubeVirt 1.7 + k8s 1.36 bug, kubevirt#17858).
#
# Each VM's cloud-init lives in its own Secret (<vm>-cloudinit, key: userdata) and is
# referenced with secretRef: KubeVirt rejects inline cloudInitNoCloud.userData
# above 2048 bytes, and the telco-cp bootstrap is larger than that.
---
apiVersion: v1
kind: Secret
metadata:
  name: telco-cp-cloudinit
  namespace: telco
type: Opaque
stringData:
  userdata: |
    #cloud-config
    password: sylva-demo
    chpasswd: {expire: false}
    ssh_pwauth: true
    write_files:
      - path: /root/flux-sync.yaml
        content: |
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: GitRepository
          metadata: {name: telco, namespace: flux-system}
          spec:
            interval: 1m
            # TODO: set to the URL you push this repo to
            url: https://github.com/vahidtaghiloo/fiber-telco-open5gs.git
            ref: {branch: main}
          ---
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata: {name: telco-open5gs, namespace: flux-system}
          spec:
            interval: 5m
            prune: true
            sourceRef: {kind: GitRepository, name: telco}
            path: ./tenant-gitops/clusters/telco
      - path: /root/bootstrap.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          exec >>/var/log/telco-bootstrap.log 2>&1
          set -x
          # SCTP is needed by the AMF (NGAP). Ubuntu cloud kernels ship it in -extra.
          apt-get update
          apt-get install -y linux-modules-extra-$(uname -r) || true
          modprobe sctp || true
          echo sctp > /etc/modules-load.d/sctp.conf
          # net1 (rented VLAN 300 slice): the guest does not configure it by itself (cloud-init
          # only brings up the first NIC), so give it a fixed address, found by its MAC.
          # eth0 cannot be used between nodes: every masquerade VM has the same address 10.0.2.2.
          NET1_MAC=02:00:00:20:00:01
          NET1_IP=10.20.0.101
          IF=""
          for i in $(seq 1 24); do
            IF=$(ip -o link | awk -v m="$NET1_MAC" 'tolower($0) ~ m {sub(":","",$2); print $2; exit}')
            [ -n "$IF" ] && break
            sleep 5
          done
          if [ -z "$IF" ]; then
            echo "FATAL: net1 NIC with MAC $NET1_MAC not found"; ip -o link; exit 1
          fi
          cat > /etc/netplan/60-net1.yaml <<EOF2
          network:
            version: 2
            ethernets:
              net1:
                match: {macaddress: "$NET1_MAC"}
                addresses: ["$NET1_IP/24"]
          EOF2
          chmod 600 /etc/netplan/60-net1.yaml
          netplan apply
          sleep 5
          ip -4 -br addr
          echo "net1 address: $NET1_IP on $IF"
          NODEIP="--node-ip $NET1_IP"
          curl -sfL https://get.k3s.io | K3S_TOKEN=fiber-telco-demo-token sh -s - server $NODEIP --flannel-iface $IF \
            --tls-san telco-cp-api.telco.svc.cluster.local \
            --node-taint CriticalAddonsOnly=true:NoExecute \
            --disable traefik --disable servicelb --disable metrics-server
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          until k3s kubectl get nodes 2>/dev/null | grep -q ' Ready'; do sleep 5; done
          k3s kubectl apply -f https://github.com/fluxcd/flux2/releases/download/v2.8.8/install.yaml
          until k3s kubectl get crd gitrepositories.source.toolkit.fluxcd.io 2>/dev/null; do sleep 5; done
          sleep 15
          k3s kubectl apply -f /root/flux-sync.yaml
    runcmd:
      - [bash, -c, "nohup /root/bootstrap.sh >/dev/null 2>&1 &"]
---
