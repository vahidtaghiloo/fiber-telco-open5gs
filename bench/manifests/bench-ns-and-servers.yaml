# Benchmark helpers for the NESTED variant. Applied by hand inside the telco k3s cluster
# (not part of the Flux-managed tree, so Flux does not touch or prune them).
#   iperf3 server  -> telco-core (the "data network" side, N6, reached over the rented net1 slice)
#   netshoot client -> telco-edge (plain pod-to-pod baseline, no 5G in the path)
apiVersion: v1
kind: Namespace
metadata:
  name: bench
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: iperf-server, namespace: bench}
spec:
  replicas: 1
  selector: {matchLabels: {app: iperf-server}}
  template:
    metadata: {labels: {app: iperf-server}}
    spec:
      nodeSelector: {telco.example/site: core}
      containers:
        - name: iperf
          image: docker.io/nicolaka/netshoot:latest
          command: ["iperf3", "-s"]
          ports: [{containerPort: 5201}]
---
apiVersion: v1
kind: Service
metadata: {name: iperf-server, namespace: bench}
spec:
  selector: {app: iperf-server}
  ports:
    - {name: tcp, port: 5201, protocol: TCP}
    - {name: udp, port: 5201, protocol: UDP}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: netshoot-edge, namespace: bench}
spec:
  replicas: 1
  selector: {matchLabels: {app: netshoot-edge}}
  template:
    metadata: {labels: {app: netshoot-edge}}
    spec:
      nodeSelector: {telco.example/site: edge}
      containers:
        - name: netshoot
          image: docker.io/nicolaka/netshoot:latest
          command: ["sleep", "infinity"]
