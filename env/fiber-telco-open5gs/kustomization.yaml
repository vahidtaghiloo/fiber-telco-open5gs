apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 'base' = exactly one BareMetalHost (workload-cp-0); see sylva-tenant-demo.
resources:
  - ../base-capm3-virt/base

configMapGenerator:
  - name: sylva-units-values
    behavior: merge
    files:
      - values=values.yaml
      - fiber-telco=fiber-telco.yaml

patches:
  - target:
      kind: SylvaUnitsRelease
      name: sylva-units
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          type: ConfigMap
          name: sylva-units-values
          valuesKey: fiber-telco
