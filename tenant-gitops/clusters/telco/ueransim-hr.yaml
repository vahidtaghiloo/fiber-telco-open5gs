apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ueransim
  namespace: open5gs
spec:
  interval: 10m
  timeout: 15m
  releaseName: ueransim
  dependsOn:
    - name: open5gs
  chart:
    spec:
      chart: ueransim-gnb
      version: "0.2.6"
      sourceRef: {kind: HelmRepository, name: gradiant}
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3}}
  valuesFrom:
    - kind: ConfigMap
      name: ueransim-values
      valuesKey: values.yaml
