# Stable entry point for the Open5GS WebUI (admin / 1423) on every tenant node:
#   http://<tenant node IP>:30999
# From a laptop the simplest path is: kubectl port-forward -n open5gs svc/open5gs-webui 9999
apiVersion: v1
kind: Service
metadata:
  name: open5gs-webui-nodeport
  namespace: open5gs
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: webui
    app.kubernetes.io/instance: open5gs
  ports:
    - name: http
      port: 9999
      targetPort: http
      nodePort: 30999
