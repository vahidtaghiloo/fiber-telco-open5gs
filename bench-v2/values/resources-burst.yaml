# bench-v2 / profile BURST (experiment E5, "use idle resources"): small guaranteed share, large ceiling.
# Same requests as FIXED divided by 4, limits = the whole group budget (core NFs may use up to 8 CPU together, UPF up to 4).
# Only meaningful for `direct`: a VM cannot lend its idle vCPUs to the other VM. Run nested with FIXED.
