# bench-v2 / profile FIXED: identical pod CPU + memory for BOTH variants (nested and direct).
# requests == limits  ->  QoS class Guaranteed, so a pod can neither burst above its budget nor be starved.
# Layer it on top of the variant's values:   helm template ... -f values/open5gs-<variant>.yaml -f values/resources-fixed.yaml
#
# Budget (README section 4). In nested the pods run in VMs of 8 vCPU (core) and 4 vCPU (edge); the pods get 1 vCPU LESS than the VM,
# because the guest OS, k3s, Calico and CoreDNS also need CPU, and a Guaranteed pod cannot be scheduled if the requests on a node
# add up to more than its CPUs. The direct pods get exactly the same limits.
#   core  7.0 CPU / 9.0 GiB of pods   (VM telco-core: 8 vCPU / 12 GiB)
#   edge  UPF 1.5 CPU / 2 GiB + generator 1.5 CPU / 4 GiB = 3.0 CPU / 6 GiB of pods   (VM telco-edge: 4 vCPU / 8 GiB)
