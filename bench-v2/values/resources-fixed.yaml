smf:      {resources: {requests: {cpu: "1",    memory: 1Gi},   limits: {cpu: "1",    memory: 1Gi}}}
scp:      {resources: {requests: {cpu: "1",    memory: 1Gi},   limits: {cpu: "1",    memory: 1Gi}}}
