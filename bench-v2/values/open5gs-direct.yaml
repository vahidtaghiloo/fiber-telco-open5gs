# bench-v2 copy of bench/direct/open5gs-values.yaml (direct variant) = the nested values without nodeSelectors.
# Generated from tenant-gitops/clusters/telco/values/open5gs-values.yaml with every nodeSelector removed
# (the single-node Sylva workload cluster has no telco.example/site labels).
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false
smf:
  config:
    pcrf:
      enabled: false
amf:
  config:
    guamiList:
    - plmn_id:
        mcc: '999'
        mnc: '70'
      amf_id:
        region: 2
        set: 1
    taiList:
    - plmn_id:
        mcc: '999'
        mnc: '70'
      tac:
      - 1
    plmnList:
    - plmn_id:
        mcc: '999'
        mnc: '70'
      s_nssai:
      - sst: 1
        sd: '0x111111'
nssf:
  config:
    nsiList:
    - uri: ''
      sst: 1
      sd: '0x111111'
# The WebUI is off in the baseline: its init container uses an image that no longer exists, and in the nested variant a Flux
# post-render patch replaces it (not available with `helm template`). It is not needed for the benchmarks.
webui:
  enabled: false
  ingress:
    enabled: false
populate:
  enabled: true
  initCommands:
  - open5gs-dbctl add_ue_with_slice 999700000000001 465B5CE8B199B49FAA5F0A2EE238A6BC
    E8ED289DEBA952E4283B54E88E6183CA internet 1 111111
  - open5gs-dbctl add_ue_with_slice 999700000000002 465B5CE8B199B49FAA5F0A2EE238A6BC
    E8ED289DEBA952E4283B54E88E6183CA internet 1 111111
mongodb:
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: 5.0.10-debian-11-r3
ausf: {}
nrf: {}
pcf: {}
scp: {}
udm: {}
udr: {}
upf: {}
